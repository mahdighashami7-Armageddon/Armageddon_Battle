<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0e1a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>نبرد آرماگدون</title>
  <style>
:root {
  --bg: #0e1a14;
  --pn: rgba(12, 24, 18, .92);
  --pn2: rgba(20, 38, 28, .94);
  --ln: #ffcf4a;
  --bd: #355242;
  --tx: #f4f7ee;
  --mut: #9ab5a3;
  --red: #ff5e4d;
  --grn: #46d46e;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  color: var(--tx);
  font: 700 12px system-ui, Tahoma, "Noto Sans Arabic", sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#c {
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100%;
  height: 100dvh;
}

/* دکمه‌های استاندارد */
button {
  font: inherit;
  color: var(--tx);
  background: var(--pn2);
  border: 1.5px solid var(--bd);
  border-radius: 10px;
  padding: 4px 8px;
  min-width: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  line-height: 1.15;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s ease, border-color .12s ease, background .12s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
}

button:active { transform: scale(.95); }
button:disabled { opacity: .38; pointer-events: none; }
button small { color: var(--ln); font-weight: 900; font-size: 10px; }
button.cancel-btn {
  background: rgba(110, 28, 24, .92);
  border-color: var(--red);
  color: #ffdfdc;
  flex-direction: row;
  gap: 4px;
  font-weight: 900;
}
button.act-btn { background: rgba(28, 62, 44, .94); border-color: #52946b; }
button.atk-btn { background: rgba(105, 38, 24, .94); border-color: #ff7a59; }

.hud { position: fixed; display: flex; gap: 5px; z-index: 2; }

/* نوار بالا */
#top {
  top: max(5px, env(safe-area-inset-top));
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  height: 36px;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}
#top > * { pointer-events: auto; }

.res-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--pn);
  border: 1.5px solid rgba(255, 207, 74, .55);
  border-radius: 18px;
  padding: 3px 11px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .4);
}
.pill { font-size: 14px; font-weight: 900; color: var(--ln); white-space: nowrap; }
.pill-sub {
  font-size: 11px;
  color: #9fe6b4;
  font-weight: 800;
  border-right: 1px solid rgba(255, 255, 255, .15);
  padding-right: 7px;
  white-space: nowrap;
}

.top-tools { display: flex; gap: 4px; align-items: center; }
.top-tools button {
  min-width: 34px;
  height: 34px;
  padding: 0 7px;
  border-radius: 9px;
  font-size: 12px;
  flex-direction: row;
  gap: 3px;
}

/* بنر راهنما و هشدار وسط بالا */
#hint {
  top: calc(max(5px, env(safe-area-inset-top)) + 40px);
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #ffdc6a, #f0b429);
  color: #1a1608;
  padding: 4px 14px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
  display: none;
  z-index: 4;
  max-width: min(460px, 62vw);
  text-align: center;
  pointer-events: none;
}

/* ستون سمت چپ: مینی‌مپ + پنل گروه‌ها */
#mm {
  position: fixed;
  left: max(8px, env(safe-area-inset-left));
  top: calc(max(5px, env(safe-area-inset-top)) + 42px);
  width: 146px;
  height: 84px;
  opacity: .92;
  border: 2px solid var(--ln);
  border-radius: 10px;
  z-index: 2;
  background: #0e1a14;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .45);
}

#grp {
  left: max(8px, env(safe-area-inset-left));
  top: calc(max(5px, env(safe-area-inset-top)) + 132px);
  width: 146px;
  max-height: calc(100dvh - max(5px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)) - 140px);
  background: var(--pn);
  border: 1.5px solid rgba(255, 207, 74, .38);
  border-radius: 12px;
  padding: 5px;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .48);
  display: none;
}
#grp .ghd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: var(--mut);
  padding: 0 2px;
}
#grp .ggrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}
#grp button {
  min-width: 0;
  min-height: 28px;
  padding: 2px 5px;
  font-size: 10.5px;
  flex-direction: row;
  justify-content: space-between;
  gap: 2px;
  border-radius: 7px;
}
#grp button.on { border-color: var(--ln); background: #254d34; }

/* منوی انتخاب ارتش */
#armyMenu {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  width: 150px;
  background: var(--pn);
  border: 1.5px solid rgba(255, 207, 74, .45);
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
  z-index: 6;
}

/* پنل فرماندهی سمت راست (کارت تاکتیکی ۲ ستونه) */
#side {
  top: calc(max(5px, env(safe-area-inset-top)) + 42px);
  right: max(8px, env(safe-area-inset-right));
  width: 196px;
  max-height: calc(100dvh - max(5px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)) - 48px);
  background: var(--pn);
  border: 1.5px solid rgba(255, 207, 74, .45);
  border-radius: 14px;
  padding: 6px;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .55);
  display: none;
}
.shd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255, 255, 255, .12);
  font-size: 11px;
  color: var(--ln);
}
.shd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 900; }
.shd button { min-width: 0; min-height: 24px; height: 24px; padding: 0 7px; font-size: 11px; border-radius: 7px; }
.scat { font-size: 10px; color: var(--mut); margin: 1px 2px -2px; text-align: right; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: 100%; }
.sgrid button { width: 100%; min-width: 0; min-height: 40px; padding: 3px 4px; font-size: 11px; border-radius: 9px; }
.sgrid button.full { grid-column: 1 / -1; min-height: 34px; flex-direction: row; justify-content: center; gap: 6px; }

/* نوار چیپ‌های شلیک/عملیات سریع (#qf) */
#qf {
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(max(5px, env(safe-area-inset-bottom)) + 58px);
  max-width: calc(100vw - 364px);
  overflow-x: auto;
  scrollbar-width: none;
  gap: 4px;
  pointer-events: none;
  padding: 2px 4px;
}
#qf::-webkit-scrollbar { display: none; }
#qf button {
  pointer-events: auto;
  min-width: 0;
  min-height: 30px;
  padding: 3px 9px;
  flex-direction: row;
  gap: 5px;
  border-radius: 10px;
  font-size: 11.5px;
  flex-shrink: 0;
}
#qf button b { color: var(--ln); font-size: 12.5px; }
#qf button.on { background: #7a2a1c; border-color: #ff6a5a; }

/* نوار ساخت‌وساز پایین */
#bar {
  bottom: max(5px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100vw - 364px);
  background: var(--pn);
  border: 1.5px solid rgba(255, 207, 74, .4);
  border-radius: 14px;
  padding: 4px 6px;
  gap: 4px;
  overflow-x: auto;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .55);
  scrollbar-width: none;
}
#bar::-webkit-scrollbar { display: none; }
#bar button { min-width: 54px; min-height: 44px; padding: 3px 6px; border-radius: 9px; font-size: 11px; flex-shrink: 0; }

/* نشانگر بازیکنان در حالت ۴ نفره */
#ffs {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: none;
  gap: 6px;
  pointer-events: none;
  background: rgba(10, 22, 18, .62);
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 14px;
  padding: 3px 9px;
  font-size: 12px;
  color: #f4f7ee;
  align-items: center;
  direction: ltr;
}
#ffs i {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  margin: 0 2px -1px;
  border: 1.5px solid rgba(255, 255, 255, .7);
}
#ffs b { margin: 0 2px; }

@media (max-width: 740px) {
  #mm { width: 128px; height: 74px; }
  #grp { width: 128px; top: calc(max(5px, env(safe-area-inset-top)) + 122px); }
  #side { width: 176px; padding: 5px; }
  #bar { max-width: calc(100vw - 324px); }
  #bar button { min-width: 48px; min-height: 40px; font-size: 10px; }
  #qf { max-width: calc(100vw - 324px); bottom: calc(max(5px, env(safe-area-inset-bottom)) + 52px); }
}

/* پنجره‌های مودال و لابی */
.ov {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 16, 12, .88);
}
.card {
  background: #16261d;
  border: 3px solid var(--ln);
  border-radius: 20px;
  padding: 16px 24px;
  text-align: center;
  max-width: 460px;
  max-height: 94vh;
  overflow: auto;
}
h1 { margin: 0 0 6px; font-size: 30px; font-weight: 900; color: var(--ln); }
p { margin: 6px 0 12px; line-height: 1.8; }
.row { display: flex; gap: 8px; justify-content: center; }
.row button { font-size: 15px; padding: 9px 16px; min-width: 76px; }

textarea, input {
  user-select: text;
  -webkit-user-select: text;
  font: 12px monospace;
  background: #0e1a14;
  color: #f4f7ee;
  border: 2px solid #3a5545;
  border-radius: 8px;
  width: 100%;
  padding: 4px;
  direction: ltr;
}

#rot { display: none; z-index: 9; font-size: 20px; background: #0e1a14; }
@media (orientation: portrait) { #rot { display: flex; } }

/* لودینگ و منوی اصلی */
#ld {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 38%, #1a3524 0%, #0b140f 72%);
  transition: opacity .55s ease;
  overflow: hidden;
}
#ld.out { opacity: 0; pointer-events: none; }
#ld::before {
  content: "";
  position: absolute;
  inset: -40%;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 46px),
              repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 46px);
  transform: perspective(520px) rotateX(60deg);
  opacity: .9;
}
.ld-in { position: relative; text-align: center; width: min(360px, 82vw); }
.ld-star { font-size: clamp(34px, 11vh, 56px); filter: drop-shadow(0 0 16px rgba(255, 207, 74, .65)); animation: ldpulse 1.8s ease-in-out infinite; }
.ld-t {
  margin: 4px 0 12px;
  font-size: clamp(24px, 8vh, 38px);
  font-weight: 900;
  background: linear-gradient(180deg, #fff2b8, #ffcf4a 55%, #e08a1e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ld-bar { height: 9px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .5); }
.ld-bar i {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: 9px;
  background: linear-gradient(90deg, #ffcf4a, #ff9d2e);
  transform-origin: right center;
  transform: scaleX(.03);
  transition: transform .25s ease-out;
}
.ld-bar.ind i { width: 38%; transform-origin: center; transition: none; animation: ldind 1.15s ease-in-out infinite alternate; }
.ld-s { margin-top: 9px; font-size: 14px; color: #cfe0d2; }
.ld-tip { margin-top: 12px; min-height: 34px; font-size: 12px; line-height: 1.7; color: #8fa898; padding: 0 6px; }

@keyframes ldind { from { transform: translateX(150%); } to { transform: translateX(-150%); } }
@keyframes ldpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.mnu { position: fixed; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; overflow: hidden; background: #0a120e; }
.mn-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 80% at 25% 45%, rgba(255, 207, 74, .13), transparent 62%),
              radial-gradient(ellipse 80% 70% at 85% 95%, rgba(59, 123, 216, .18), transparent 66%),
              linear-gradient(165deg, #12281c, #0a120e 72%);
}
.mn-grid {
  position: absolute;
  inset: -60% -30% -10%;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 48px),
              repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 48px);
  -webkit-mask-image: radial-gradient(ellipse at 50% 70%, #000 8%, transparent 68%);
  mask-image: radial-gradient(ellipse at 50% 70%, #000 8%, transparent 68%);
  transform: perspective(520px) rotateX(62deg);
  animation: mngrid 6s linear infinite;
  will-change: transform;
}
.mn-radar {
  position: absolute;
  width: 150vmax;
  height: 150vmax;
  left: 50%;
  top: 50%;
  margin: -75vmax 0 0 -75vmax;
  background: conic-gradient(from 0deg, rgba(110, 225, 255, 0) 0deg, rgba(110, 225, 255, .09) 38deg, rgba(110, 225, 255, 0) 62deg);
  animation: mnspin 10s linear infinite;
  pointer-events: none;
  will-change: transform;
}
.mn-wrap { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: clamp(22px, 7vw, 84px); padding: 14px 22px; max-width: 100%; max-height: 100%; }
.mn-brand { text-align: center; }
.mn-star { font-size: clamp(38px, 13vh, 68px); filter: drop-shadow(0 0 18px rgba(255, 207, 74, .6)); animation: mnfloat 3.4s ease-in-out infinite; }
.mn-title {
  margin: 2px 0 4px;
  font-size: clamp(30px, 11vh, 56px);
  font-weight: 900;
  line-height: 1.25;
  background: linear-gradient(180deg, #fff4c2, #ffcf4a 55%, #e08a1e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .5));
}
.mn-sub { font-size: clamp(11px, 3.4vh, 15px); color: #9fb7a6; letter-spacing: .4px; }
.mn-btns { display: flex; flex-direction: column; gap: clamp(7px, 2vh, 12px); width: min(310px, 44vw); }
.mn-b {
  width: 100%;
  min-width: 0;
  flex-direction: column;
  gap: 2px;
  padding: clamp(8px, 2.4vh, 13px) 16px;
  border-radius: 16px;
  border: 2px solid rgba(255, 207, 74, .32);
  background: linear-gradient(180deg, rgba(33, 62, 46, .96), rgba(18, 34, 26, .96));
  color: var(--tx);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  transition: transform .12s ease, box-shadow .2s ease;
}
.mn-b b { font-size: clamp(15px, 4.6vh, 20px); font-weight: 900; }
.mn-b small { color: #9fb7a6; font-weight: 700; font-size: clamp(10px, 2.8vh, 12px); }
.mn-b.pri { background: linear-gradient(180deg, #ffdc6a, #e8a420); border-color: #fff1b0; color: #2a1d00; box-shadow: 0 8px 26px rgba(255, 190, 50, .38); }
.mn-b.pri small { color: #5a4200; }
.mn-b:active { transform: scale(.96); }
.mn-b.dis, .mn-b.dis:disabled {
  padding: clamp(6px, 1.8vh, 10px) 16px;
  background: linear-gradient(180deg, #4b504d, #363a38);
  border-color: rgba(190, 200, 195, .28);
  color: #a3aca7;
  box-shadow: none;
  opacity: 1;
  cursor: not-allowed;
  filter: grayscale(1);
}
.mn-b.dis b { font-size: clamp(13px, 3.8vh, 16px); }
.mn-b.dis:active { transform: none; }
.mn-row { display: flex; gap: 8px; }
.mn-s { flex: 1; min-width: 0; flex-direction: row; justify-content: center; gap: 6px; padding: clamp(6px, 1.8vh, 9px) 6px; font-size: 12px; border-radius: 12px; background: rgba(14, 26, 20, .8); }
.mn-ver { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: #5d7567; z-index: 1; }
.mnu.in .mn-brand { animation: mnin .6s ease both; }
.mnu.in .mn-btns { animation: mnin .6s .12s ease both; }

@keyframes mnin { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes mnfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes mnspin { to { transform: rotate(360deg); } }
@keyframes mngrid { from { transform: perspective(520px) rotateX(62deg) translateY(0); } to { transform: perspective(520px) rotateX(62deg) translateY(48px); } }

@media (max-height: 360px) { .mn-sub { display: none; } .mn-wrap { gap: 24px; } }
@media (prefers-reduced-motion: reduce) { .mn-grid, .mn-radar, .mn-star, .ld-star { animation: none; } }

/* پنجره درباره بازی */
.ov.top { z-index: 7; background: rgba(6, 12, 9, .72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.ab {
  max-width: 560px;
  max-height: 92vh;
  overflow: auto;
  text-align: center;
  border: 2px solid rgba(255, 207, 74, .4);
  background: radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255, 207, 74, .16), transparent 70%),
              linear-gradient(180deg, #183324, #0d1912);
}
.ab h1 { font-size: 22px; margin: 2px 0 0; }
.ab-star { font-size: 40px; line-height: 1.1; filter: drop-shadow(0 0 14px rgba(255, 207, 74, .6)); animation: mnfloat 3.4s ease-in-out infinite; }
.ab-sub { font-size: 12px; color: #9fb7a6; letter-spacing: .4px; }
.ab-line { height: 2px; margin: 12px auto; width: 64%; background: linear-gradient(90deg, transparent, #ffcf4a, transparent); }
.ab-role { font-size: 12px; color: #ffcf4a; font-weight: 800; margin-bottom: 8px; }
.ab-names { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
.ab-n {
  flex: 1 1 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 10px 12px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 207, 74, .14), rgba(14, 26, 20, .88));
  border: 1.5px solid rgba(255, 207, 74, .38);
  box-shadow: 0 6px 16px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.ab-n i {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-style: normal; font-weight: 900; font-size: 20px; color: #3b2a00;
  background: radial-gradient(circle at 35% 30%, #ffe68a, #ffcf4a 55%, #d9a21c);
  box-shadow: 0 0 14px rgba(255, 207, 74, .45);
}
.ab-n b { font-weight: 900; font-size: 15px; color: #f4f7ee; line-height: 1.5; }

</style>
</head>
<body>

'use strict';

/* ============================================================================

 * ============================================================================ */

const SS = 2, SPR = {};

function SP(k, w, h, f) {
  if (SPR[k]) return SPR[k];
  const c = document.createElement('canvas');
  c.width = w * SS;
  c.height = h * SS;
  const g = c.getContext('2d');
  g.scale(SS, SS);
  g.translate(w / 2, h / 2);
  f(g);
  return SPR[k] = c;
}

const lg = (g, a, b, c, d, s, t) => {
  const q = g.createLinearGradient(a, b, c, d);
  q.addColorStop(0, s);
  q.addColorStop(1, t);
  return q;
};

function nz(g, a, b, w, h, n, c) {
  g.fillStyle = c;
  for (let i = 0; i < n; i++) g.fillRect(a + R() * w, b + R() * h, 1.3, 1.3);
}

function bx(g, a, b, w, h, dp, t, s) {
  g.fillStyle = lg(g, 0, b + h - dp, 0, b + h, s[0], s[1]);
  g.fillRect(a, b + h - dp, w, dp);
  g.fillStyle = lg(g, a, b - dp, a + w, b + h - dp, t[0], t[1]);
  g.fillRect(a, b - dp, w, h);
  nz(g, a, b - dp, w, h, w * h / 8, 'rgba(0,0,0,.13)');
  nz(g, a, b - dp, w, h, w * h / 12, 'rgba(255,255,255,.12)');
  g.strokeStyle = 'rgba(255,255,255,.4)';
  g.lineWidth = 1;
  g.strokeRect(a + .5, b - dp + .5, w - 1, h - 1);
  g.strokeStyle = 'rgba(0,0,0,.4)';
  g.strokeRect(a + .5, b + h - dp + .5, w - 1, dp - 1);
}

function star(g, r, c) {
  g.fillStyle = c;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -PI / 2 + i * PI / 5, d = i % 2 ? r * .45 : r;
    g.lineTo(Math.cos(a) * d, Math.sin(a) * d);
  }
  g.closePath();
  g.fill();
}

function shd(c) {
  const s = document.createElement('canvas');
  s.width = c.width;
  s.height = c.height;
  const g = s.getContext('2d');
  g.drawImage(c, 0, 0);

    g.fill(); g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1; g.stroke();

function bsp(k, t) {

const seaT = (px, py) => {
  const dx = Math.min(px - MX, WW - MX - px), dy = Math.min(py - MY, WH - MY - py);

  if (d < -420) return 5;
  const n = Math.sin(px * .0043 + py * .0021) * 70 + Math.sin(py * .0087 - px * .0019) * 45 + Math.sin(px * .013) * 25;
  const t = Math.max(0, Math.min(1, (-d - 60 + n) / 170));

};

const lakeT = (px, py) => {
  if (!LKG.size) return 0;
  const b = LKG.get((px / 400 | 0) * 64 + (py / 400 | 0));
  if (!b) return 0;

  for (let i = 0; i < b.length; i++) {
    const l = b[i], dx = px - l[0], dy = py - l[1], q = l[2] * l[2], d2 = dx * dx + dy * dy;
    if (d2 < q) s += Math.min(1, 1.8 * (1 - Math.sqrt(d2) / l[2])) * 3.2;

};

function hv(px, py) {

function prepLakes() {
  LKR = []; LKG = new Map();
  const CS = G * 2, nx = Math.floor(WW / CS), ny = Math.floor(WH / CS), N = nx * ny;
  const w = new Uint8Array(N), lab = new Int32Array(N), q = new Int32Array(N), L = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) w[j * nx + i] = hv(i * CS + CS / 2, j * CS + CS / 2) > .5 ? 1 : 0;
  let c = 0;
  for (let s = 0; s < N; s++) {
    if (!w[s] || lab[s]) continue;
    c++; let h = 0, t = 0, edge = 0; q[t++] = s; lab[s] = c;
    while (h < t) {
      const i = q[h++], cx = i % nx, cy = (i / nx) | 0;
      if (!cx || !cy || cx === nx - 1 || cy === ny - 1) edge = 1;
      if (cx > 0 && w[i - 1] && !lab[i - 1]) { lab[i - 1] = c; q[t++] = i - 1; }
      if (cx < nx - 1 && w[i + 1] && !lab[i + 1]) { lab[i + 1] = c; q[t++] = i + 1; }
      if (cy > 0 && w[i - nx] && !lab[i - nx]) { lab[i - nx] = c; q[t++] = i - nx; }
      if (cy < ny - 1 && w[i + nx] && !lab[i + nx]) { lab[i + nx] = c; q[t++] = i + nx; }
    }
    if (edge) continue;
    let sx = 0, sy = 0;
    for (let k = 0; k < t; k++) { sx += q[k] % nx; sy += (q[k] / nx) | 0; }
    const mx = sx / t, my = sy / t; let rr = 0;
    for (let k = 0; k < t; k++) { const d = Math.hypot(q[k] % nx - mx, ((q[k] / nx) | 0) - my); if (d > rr) rr = d; }
    L.push([(mx + .5) * CS, (my + .5) * CS, (rr + 2) * CS + 70, t]);
  }
  L.sort((a, b) => b[3] - a[3]);
  LKR = L.filter((l, i) => i % 2 === 1).map(l => [l[0], l[1], l[2]]);
  for (const l of LKR) {
    for (let a = Math.floor((l[0] - l[2]) / 400); a <= Math.floor((l[0] + l[2]) / 400); a++) {
      for (let b = Math.floor((l[1] - l[2]) / 400); b <= Math.floor((l[1] + l[2]) / 400); b++) {
        const k = a * 64 + b; let r = LKG.get(k); if (!r) LKG.set(k, r = []); r.push(l);
      }
    }
  }
}

function buildSea() {
  const N = NX * NY; OC = new Uint8Array(N); const q = new Int32Array(N); let h = 0, t = 0;

  for (let i = 0; i < NX; i++) { sd(i); sd((NY - 1) * NX + i); }
  for (let j = 0; j < NY; j++) { sd(j * NX); sd(j * NX + NX - 1); }
  while (h < t) {
    const i = q[h++], cx = i % NX, cy = (i / NX) | 0;

    if (cy > 0) sd(i - NX); if (cy < NY - 1) sd(i + NX);
  }
  const er = a => {
    const o = new Uint8Array(N);
    for (let j = 1; j < NY - 1; j++) for (let i = 1; i < NX - 1; i++) {
      const k = j * NX + i;
      if (a[k] && a[k - 1] && a[k + 1] && a[k - NX] && a[k + NX] && a[k - NX - 1] && a[k - NX + 1] && a[k + NX - 1] && a[k + NX + 1]) o[k] = 1;

  const g = terr.getContext('2d'); g.save(); g.setTransform(TS, 0, 0, TS, 0, 0); g.lineWidth = 2.2; g.lineCap = 'round';
  for (let n = 0; n < 7000; n++) {

    g.beginPath(); g.arc(px, py + 30, 24 + Math.random() * 26, PI * 1.18, PI * 1.82); g.stroke();

function dil() {
  const o = new Uint8Array(NX * NY);
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    if (wa[j * NX + i]) {
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {

        if (x2 >= 0 && y2 >= 0 && x2 < NX && y2 < NY) o[y2 * NX + x2] = 1;

}

function buildComp() {
  const N = NX * NY;
  if (COMP.length !== N) COMP = new Int32Array(N); else COMP.fill(0);
  const q = new Int32Array(N); let cid = 0;
  for (let s = 0; s < N; s++) {
    if (WD[s] || COMP[s]) continue;
    COMP[s] = ++cid; let h = 0, t = 0; q[t++] = s;
    while (h < t) {

      for (let d = 0; d < 8; d++) {
        const nx = cx + DX[d], ny = cy + DY[d];

        const ni = ny * NX + nx;

}

/* تولید کامل بوم نقشه */
function gen() {
  inGen = 1;
  try {
    TRS = []; TG = new Map();
    genRich();
    wa = new Uint8Array(NX * NY); V = new Float32Array(NX * NY);
    terr = document.createElement('canvas'); terr.width = WW * TS; terr.height = WH * TS;
    const g = terr.getContext('2d'); g.scale(TS, TS);
    g.fillStyle = '#9acd5a'; g.fillRect(0, 0, WW, WH);
    for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
      const v = V[j * NX + i] = hv(i * G + 10, j * G + 10);
      wa[j * NX + i] = v > .5 ? 1 : 0;
      if ((i + j) & 1) { g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(i * G, j * G, G, G); }
    }
    const sw = WW / (5 * WSC), sh = WH / (5 * WSC), sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
    const sx = sc.getContext('2d'), im = sx.createImageData(sw, sh);
    const cs = [[.32, 232, 219, 165], [.5, 92, 199, 238], [.72, 43, 151, 221], [1, 23, 87, 143]];
    for (let j = 0; j < sh; j++) for (let i = 0; i < sw; i++) {
      const v = hv(i * 5 * WSC + 2, j * 5 * WSC + 2); let c = 0;
      for (const q of cs) if (v > q[0]) c = q;
      if (c) { const o = (j * sw + i) * 4; im.data[o] = c[1]; im.data[o + 1] = c[2]; im.data[o + 2] = c[3]; im.data[o + 3] = 255; }
    }
    sx.putImageData(im, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(sc, 0, 0, WW, WH);
    for (let n = 0; n < 3200 * ARF; n++) {
      const px = R() * WW, py = R() * WH, v = V[(py / G | 0) * NX + (px / G | 0)];
      if (v > .1 || BS.some(b => H2(b.x - px, b.y - py) < 150) || RND.some(r => H2(r.x - px, r.y - py) < 140)) continue;
      if (R() < .12) {
        g.fillStyle = '#d8372f';
        for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(px + R() * 14 - 7, py + R() * 10 - 5, 3, 0, PI * 2); g.fill(); }
      }
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    forests();
    TRS.sort((a, b) => a.y - b.y);
    for (const t of TRS) { const k = ((t.x / 40 | 0) << 10) + (t.y / 40 | 0); let l = TG.get(k); if (!l) TG.set(k, l = []); l.push(t); }
    tex();
    WD = dil();
    buildComp();
  } finally {
    inGen = 0;
  }

}

function connOK() {

/* انتخاب نزدیک‌ترین/بهترین هدف */

        if (!a && (e.sA = (e.sA || 0) - dt) <= 0) {

          for (const o of E) {
            if (o.dead || o.team === e.team || !o.b || o.hp <= 0 || (!e.team && !o.v)) continue;
            const q = (o.x - e.x) ** 2 + (o.y - e.y) ** 2;
            if (q < bd) { bd = q; a = o; }
          }
          e.aT = a || null;
        }
        if (a && H2(a.x - e.x, a.y - e.y) - a.r > f.rng * .85) sail(e, a.x, a.y, dt, 30);
      }
    }
    if (f.rng && !(e.empT > 0) && e.cd <= 0) {
      const o = t && can(f, t) && H2(t.x - e.x, t.y - e.y) - (t.b ? t.r : 0) < f.rng ? t : sNear(e, f);
      if (o) {
        e.ta = Math.atan2(o.y - e.y, o.x - e.x); e.tl = f.cd + 1.4;
        if (Math.abs(angDiff(e.ta, e.tur == null ? e.a : e.tur)) < .45) shoot(e, o, f);
      }
    }
  }
  if (e.k === 'cv') deck(e);
  e.tur = angStep(e.tur == null ? e.a : e.tur, e.tl > 0 && e.ta != null ? e.ta : e.a, 7 * dt);
}

function gnd(e, dt) {
  const f = df(e);
  if (f.ship) return shipAI(e, dt);
  if (!e.sk && !e.dead && wat(e.x, e.y)) {
    FX.push({ x: e.x, y: e.y, vx: 0, vy: 0, l: .9, m: .9, r: 20, c: '#dff6ff', ring: 1 });
    for (let i = 0; i < 10; i++) {
      const a = R() * PI * 2, s = 30 + R() * 60;
      FX.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: .7, m: .7, r: 3 + R() * 4, c: '#e8f8ff' });
    }
    e.sk = .01;
    return;
  }
  if (e.sk) {
    e.sk += dt;
    if (e.sk > 1.6) e.dead = 1;
    if (R() < .4) FX.push({ x: e.x + R() * 24 - 12, y: e.y + R() * 24 - 12, vx: 0, vy: 0, l: .5, m: .5, r: 6, c: '#e8f8ff' });
    return;
  }
  if (e.k === 'rep' && !e.dead && e.hp > 0) { e.tl -= dt; repTick(e, dt); return; }
  if (e.hk > 0) { if (e.rec > 0) e.rec = Math.max(0, e.rec - dt * 4.5); return; }
  if (e.k === 'tank' && !e.dead && e.hp > 0) brain(e, dt);
  if (e.am && e.tx != null && !e.tgt && f.rng && f.hitG) {
    const o = near(e, f.rng * 1.05, f);
    if (o) e.tgt = o;
  }
  e.cd -= dt; e.tl -= dt;
  if (e.rec > 0) e.rec = Math.max(0, e.rec - dt * 4.5);
  if (f.ammo && e.ammo <= 0) { e.rl += dt; if (e.rl > 5) { e.ammo = f.ammo; e.rl = 0; } }
  let t = e.tgt;
  if (t && (t.dead || t.hp <= 0 || (e.team ? t['v' + e.team] === false : !t.v))) e.tgt = t = null;
  if (t) { if (H2(t.x - e.x, t.y - e.y) > (f.rng || 50) * .85) mv(e, t.x, t.y, dt, f.sp, 4); }
  else if (e.tx != null && mv(e, e.tx, e.ty, dt, f.sp, 4)) e.tx = null;
  if (f.rng && !(e.empT > 0) && e.cd <= 0 && (!f.ammo || e.ammo > 0)) {
    const o = t && can(f, t) && H2(t.x - e.x, t.y - e.y) < f.rng ? t : near(e, f.rng, f);
    if (o) {
      e.ta = Math.atan2(o.y - e.y, o.x - e.x); e.tl = f.cd + 1.4;
      if (angDiff(e.ta, e.tur == null ? e.a : e.tur) < .45) shoot(e, o, f);
    }
  } else if (t && f.rng && H2(t.x - e.x, t.y - e.y) < f.rng * 1.25) {
    e.ta = Math.atan2(t.y - e.y, t.x - e.x); e.tl = Math.max(e.tl, .3);
  }
  if (e.tl <= 0) e.ta = e.a;
  e.tur = angStep(e.tur == null ? e.a : e.tur, e.ta == null ? e.a : e.ta, 6.2 * dt);
  if (e.rec > .7) e.rvT = GT + 3.5;
  if (e.mnA && e.k === 'trc') {
    e.mnT = (e.mnT || 0) + dt;
    if (e.tx == null || e.mnT > 90) {
      e.mnA = 0;
      if (e.tx == null && H2(e.x - e.mnX, e.y - e.mnY) < 80) XC(e.team, { c: 'MN', id: e.id });
    }
  }
}

function crash(e, dt) {
  e.sk += dt;
  const t = e.sk, p = Math.min(1, t / CR_T), v = e.cs * (1 - .7 * p);
  e.x = Math.max(8, Math.min(WW - 8, e.x + Math.cos(e.cdir) * v * dt));
  e.y = Math.max(8, Math.min(WH - 8, e.y + Math.sin(e.cdir) * v * dt));
  if (t < 1) e.a = e.cdir + Math.sin(t * 10) * .5 * t; else e.a += e.spn * dt * (1 + (t - 1) * .9);
  if (t >= CR_T) { bfx(e.x, e.y, 66, 1); bfx(e.x + 16, e.y - 10, 30); bfx(e.x - 18, e.y + 12, 26); e.hp = 0; kill(e); }
}

function fly(e, dt) {
  if (e.sk && e.cdir != null) { crash(e, dt); return; }
  const f = df(e), was = e.st;
  if ((e.k == 'f35' || e.k == 'f22') && was == 'go') {
    const t = e.tgt;
    if (t && !t.dead && t.hp > 0 && (t.b || !df(t).fl) && (e.team ? t['v' + e.team] !== false : t.v) && e.ammo >= 2 && e.cd - dt <= 0 && H2(t.x - e.x, t.y - e.y) <= 100) {
      e.ammo -= 2; e.cd = .75 + dt;
      const tx = e.k == 'f35' ? t.x : t.x + R() * 16 - 8, ty = e.k == 'f35' ? t.y : t.y + R() * 16 - 8;
      BB.push({ x0: e.x, y0: e.y, x: tx, y: ty, t: .48, T: .48, team: e.team, r: 40, d: (e.k == 'f22' ? 70 : 38) * (1 + (e.vt || 0) * .15), a: Math.atan2(ty - e.y, tx - e.x), src: e });
    }
  }
  e.cd -= dt;
  if (e.st == 'idle') { e.bank = 0; if (e.tx == null || e.hk > 0) return; e.st = 'go'; e.ins = 0; }
  if (e.st == 'go') {
    let t = e.tgt;
    if (t && (t.dead || t.hp <= 0 || (e.team ? t['v' + e.team] === false : !t.v))) e.tgt = t = null;
    if (t) { e.tx = t.x; e.ty = t.y; }
    const d = H2(e.tx - e.x, e.ty - e.y);
    mv(e, e.tx, e.ty, dt, f.sp, f.tr);
    if (f.kam) {
      if (d < 24) { boom(e.tx, e.ty, 65, 150, e.team); e.dead = 1; }
      else if (!t && d < 60) { const o = near(e, 200, { hitG: 1 }); if (o) e.tgt = o; }
      return;
    }
    if (f.bomb) {
      if (d < 95 && e.ammo > 0) { e.ins = 1; if (e.cd <= 0) { drop(e, f); e.ammo--; e.cd = e.k == 'b2' ? .32 : .16; } }
      else if (e.ins || e.ammo <= 0) e.st = 'ret';
      return;
    }
    if (e.cd <= 0 && e.ammo > 0) { const o = near(e, f.rng, f); if (o) shoot(e, o, f); }
    if (e.ammo <= 0 || (!t && d < 50)) {
      e.st = 'ret';
      if (e.k == 'f35') e.rtT = performance.now() + 700;
    }
    return;
  }
  let h = e.home;
  if (!h || h.dead) {
    h = E.find(o => o.team == e.team && !o.dead && (o.k == 'air' || (!f.bomb && o.k == 'cv')) && E.filter(u => !u.dead && u !== e && u.home === o).length < (o.k == 'cv' ? 10 : 3));
    if (h) {
      const cap = h.k == 'cv' ? 10 : 3, used = E.filter(u => !u.dead && u !== e && u.home === h).map(u => u.sl);
      let sl = 0; for (let i = 0; i < cap; i++) if (!used.includes(i)) { sl = i; break; }
      e.home = h; e.src = h.id; e.sl = sl; e.ox = h.k == 'cv' ? 0 : [-44, 0, 44][sl]; e.oy = h.k == 'cv' ? 0 : -4;
    } else e.home = null;
  }
  if (!h) {
    e.hp -= 12 * dt; if (e.hp <= 0) kill(e);
    mv(e, e.x + Math.cos(e.a) * 99, e.y + Math.sin(e.a) * 99, dt, f.sp, f.tr);
    return;
  }
  mv(e, h.x, h.y, dt, f.sp, f.tr);
  if (H2(h.x - e.x, h.y - e.y) < 26) {
    e.st = 'idle'; e.bank = 0; e.ammo = f.ammo; e.tx = null; e.tgt = null;
    if (h.k != 'cv') { e.x = h.x + (e.ox || 0); e.y = h.y + (e.oy || 0); e.a = -PI / 2; }
  }
}

/* پدافند موشکی، خوشه‌ای و تاد (THAAD) */
function mpos(m) {
  const p = Math.min(1, m.t / m.T), gx = m.x0 + (m.x1 - m.x0) * p, gy = m.y0 + (m.y1 - m.y0) * p;
  return [gx, gy - Math.sin(p * PI) * 130, gx, gy];
}

function split(m) {
  const q = mpos(m); bfx(q[0], q[1], 24);
  for (let i = 0; i < 10; i++) {
    const a = R() * PI * 2, d = R() * 130, bx = m.x1 + Math.cos(a) * d, by = m.y1 + Math.sin(a) * d, t = .4 + R() * .45;
    BB.push({ x0: q[0], y0: q[1], x: bx, y: by, t, T: t, team: m.team, r: 28, d: 18, a: Math.atan2(by - q[1], bx - q[0]) });
    TR.push({ x: q[0], y: q[1], X: bx, Y: by, l: .3, c: '#ffd27a', w: 2 });
  }
}

function aaMiss() {
  for (const e of E) {
    if (e.dead || e.cd > 0 || e.sk || e.empT > 0 || e.hk > 0) continue;
    const f = df(e), isP = e.k == 'pd';
    if (!isP && e.k != 'aa') continue;
    if (!isP && e.ammo <= 0) continue;
    let bm = null, bd = f.rng * f.rng;
    for (const m of M) {
      if (m.team == e.team || m.dead || m.hp <= 0 || m.nk) continue;
      const q = mpos(m), d = (q[2] - e.x) ** 2 + (q[3] - e.y) ** 2;
      if (d < bd) { bd = d; bm = m; }
    }
    if (bm) {
      const q = mpos(bm); e.cd = f.cd;
      if (!isP) e.ammo--;
      e.ta = Math.atan2(q[3] - e.y, q[2] - e.x); e.tl = f.cd + 1.4; e.rec = 1;
      bm.hp -= f.dmg * (1 + (e.vt || 0) * .15);
      TR.push({ x: e.x, y: e.y, X: q[0], Y: q[1], l: .12, c: e.team ? '#ffb36b' : '#cfe9ff', w: 3 });
      bfx(q[0] + R() * 8 - 4, q[1] + R() * 8 - 4, 8);
      if (bm.hp <= 0) { bm.dead = 1; bfx(q[0], q[1], 34); }
    }
  }
}

const air2 = o => !o.b && !o.dead && o.hp > 0 && !o.sk && o.st != 'idle' && df(o).fl;
const isMis = o => o.x0 !== undefined && o.x1 !== undefined;
const tp = o => { if (isMis(o)) { const q = mpos(o); return [q[0], q[1]]; } return [o.x, o.y]; };

function tgtFor(e) {
  let best = null, bs = 1e18;
  const R2 = TD.trg * TD.trg;
  for (const o of E) {
    if (o.team == e.team || !air2(o)) continue;
    if (e.team ? o['v' + e.team] === false : !o.v) continue;
    if (stl(o) || TM.some(m => m.tg === o && m.team === e.team)) continue;
    const q = (o.x - e.x) ** 2 + (o.y - e.y) ** 2;
    if (q > R2) continue;
    const s = (df(o).kam ? 2e7 : df(o).bomb ? 0 : 1e7) + q;
    if (s < bs) { bs = s; best = o; }
  }
  for (const m of M) {
    if (m.team === e.team || m.dead || m.hp <= 0 || m.nk || m.sp) continue;
    const q = mpos(m), d2 = (q[2] - e.x) ** 2 + (q[3] - e.y) ** 2;
    if (d2 > R2) continue;
    if (TM.some(z => z.tg === m && z.team === e.team)) continue;
    const tl = (m.cl ? m.T * .84 : m.T) - m.t;
    if (tl <= H2(q[0] - e.x, q[1] - e.y) / (TD.spd + 320)) continue;
    const pri = (m.cl ? -5e6 : 0) + d2;
    if (pri < bs) { bs = pri; best = m; }
  }
  return best;
}

function fire(e, o) {
  e.mcd = TD.rel;
  const P = tp(o), a = Math.atan2(P[1] - e.y, P[0] - e.x);
  e.ta = a; e.tl = .8;
  TM.push({ team: e.team, x: e.x, y: e.y, a, tg: o, tx: P[0], ty: P[1], life: 6, sp: TD.spd, src: e });
  if (window.pushEV) window.pushEV(['tm', e.team, Math.round(e.x), Math.round(e.y), Math.round(a * 100) / 100, o.id || 0, Math.round(P[0]), Math.round(P[1])]);
  for (let i = 0; i < 16; i++) {
    const b = R() * PI * 2, s = 18 + R() * 55;
    FX.push({ x: e.x, y: e.y, vx: Math.cos(b) * s, vy: Math.sin(b) * s, l: 1, m: 1, r: 7 + R() * 7, c: i % 3 ? '#e3e6e8' : '#ffd9a0' });
  }
  TR.push({ x: e.x, y: e.y, X: e.x + Math.cos(a) * 46, Y: e.y + Math.sin(a) * 46, l: .5, c: '#fff3c8', w: 6 });
}

function hitTM(m, o) {
  bfx(m.x, m.y, 26);
  if (o && isMis(o)) {
    if (!o.dead && o.hp > 0 && !o.nk) {
      const q = mpos(o); o.hp = 0; o.dead = 1; bfx(q[0], q[1], 46, 1);
      msgT(m.team, '🛰️ تاد: موشک دشمن در آسمان رهگیری و منفجر شد');
      msgT(o.team, '⚠️ تاد دشمن یکی از موشک‌هایت را در هوا زد');
    }
    return;
  }
  if (!o || !air2(o)) return;
  const F = df(o);
  if (F.bomb) {
    o.hp -= Math.max(0, Math.min(o.hp - 1, Math.round(o.mh * .22)));
    o.sk = .01; o.cdir = o.a; o.cs = F.sp * .6; o.spn = (R() < .5 ? -1 : 1) * 2.4; o.tgt = null; o.tx = null; o.ty = null;
    msgT(m.team, '🛰️ تاد: بمب‌افکن دشمن ضربه خورد و در حال سقوط است');
    msgT(o.team, '⚠️ تاد دشمن بمب‌افکنت را زد و در حال سقوط است');
  } else {
    bfx(o.x, o.y, F.kam ? 30 : 48, 1);

    o.hp = 0; kill(o);
    msgT(m.team, F.kam ? '🛰️ تاد: پهپاد دشمن در هوا منفجر شد' : '🛰️ تاد: جنگندهٔ دشمن در هوا منفجر شد');
    msgT(o.team, F.kam ? '⚠️ تاد دشمن یکی از پهپادهایت را زد' : '⚠️ تاد دشمن یکی از جنگنده‌هایت را زد');
  }
}

function thaad(dt) {
  for (const e of E) {
    if (e.k != 'tad' || e.dead || e.sk || e.empT > 0 || e.hk > 0) continue;
    if (e.mcd > 0) { e.mcd = Math.max(0, e.mcd - dt); continue; }
    const o = tgtFor(e);
    if (o) fire(e, o);
  }
  for (let i = TM.length; i--;) {
    const m = TM[i], o = m.tg;
    if (o && !o.dead && o.hp > 0) { const P = tp(o); m.tx = P[0]; m.ty = P[1]; }
    const dx = m.tx - m.x, dy = m.ty - m.y, d = H2(dx, dy), st = m.sp * dt;
    if (d <= st + 16) { m.x = m.tx; m.y = m.ty; hitTM(m, o); TM.splice(i, 1); continue; }
    const px = m.x, py = m.y; m.a = Math.atan2(dy, dx); m.x += dx / d * st; m.y += dy / d * st; m.life -= dt;
    TR.push({ x: px, y: py, X: m.x, Y: m.y, l: .5, c: 'rgba(255,245,215,.9)', w: 4 });
    if (R() < .8) FX.push({ x: m.x, y: m.y, vx: R() * 10 - 5, vy: R() * 10 - 5, l: .55, m: .55, r: 5 + R() * 3, c: 'rgba(235,238,240,.7)' });
    if (m.life <= 0) { bfx(m.x, m.y, 16); TM.splice(i, 1); }
  }
}

window.hideT = (t, rvs, src) => {

  for (const e of mine) {

    for (let v = 0; v < 4; v++) { e['sn' + v] = 0; e['sc' + v] = 0; e['v' + v] = false; e['lv' + v] = false; }

const SIGHT = e => e.b ? 240 : e.k == 'tad' ? UT.tad.vr : 300;
function sightCircles(rev) {
  const out = [], vx0 = cam.x, vx1 = cam.x + W / Z, vy0 = cam.y, vy1 = cam.y + H / Z;
  for (const e of sel) {
    if (e.dead || e.k == 'pd') continue;
    const R_ = SIGHT(e);
    if (e.x < vx0 - R_ || e.x > vx1 + R_ || e.y < vy0 - R_ || e.y > vy1 + R_) continue;
    out.push({ x: e.x, y: e.y, r: R_ * rev });
  }
  return out;
}

function drawSight(now) {

  const t = (now - selT) / 380, p = t >= 1 ? 1 : 1 - Math.pow(1 - Math.max(0, t), 3), C_ = sightCircles(p);

    x.strokeStyle = 'rgba(' + GOLD + ',' + (.72 + .2 * br) + ')'; x.lineWidth = lw; x.stroke();

  ug.setTransform(1, 0, 0, 1, 0, 0); ug.clearRect(0, 0, U.width, U.height);

/* انتخاب ساختمان اطلاعاتی که قابلیت موردنظر در آن شارژ شده است (اولویت با ساختمان انتخاب‌شده) */
const intReady = (cd, id) => {
  const l = E.filter(e => !e.team && !e.dead && e.k == 'int' && !(e.hk > 0) && !(e[cd] > 0));
  return l.find(e => e.id == id) || l[0] || null;
};
const intWait = () => E.some(e => !e.team && !e.dead && e.k == 'int')
  ? 'این قابلیت در حال شارژ است؛ برای استفادهٔ پشت‌سرهم ساختمان اطلاعات بیشتری بساز'
  : 'ساختمان اطلاعات نداری';

window.QF = k => {
  if (over || !started) return;
  if (k === 'imm' || k === 'hide') {
    const cx = cam.x + W / Z / 2, cy = cam.y + H / Z / 2;
    const cdk = k === 'imm' ? 'icd' : 'hcd';
    const b = E.filter(e => !e.team && !e.dead && e.k === 'int' && !(e.hk > 0) && !(e[cdk] > 0)).sort((a, c) => H2(a.x - cx, a.y - cy) - H2(c.x - cx, c.y - cy))[0];
    if (!b) { flash(intWait()); return; }
    if (money[0] < 5000) { flash('پول کافی نیست'); return; }
    mode = null;
    if (k === 'imm') window.immAct(b.id); else window.hideAct(b.id);
    hud();
    return;
  }
  mode = mode && mode.k == 'qf' && mode.q == k ? null : { t: 'a', k: 'qf', q: k };
  hud();
};

  $('inc').textContent = '+' + fa(E.reduce((a, e) => a + (!e.team && e.k == 'eco' && !e.dead && !(e.hk > 0) ? (e.rich ? 2 : 1) : 0), 0) * 4 + zInc) + '/ث';

  const rem = Math.max(0, BC[0] - performance.now()), has = hasHQ(0), ob = E.some(e => !e.team && e.b && !e.dead);

  const units = sel.filter(e => !e.b && !e.dead), tc = units.reduce((a, e) => a + e.dr, 0);
  let h = '';

    }
    if (s.k == 'air') {

      ['sb', 'ot', 'cv'].forEach(u => g += B(`buyU('${u}')`, UT[u].n + ' ' + fa(cntU(s, u)) + '/' + fa(SCAP[u]), UT[u].c, cntU(s, u) >= SCAP[u]));
    }
    if (s.k == 'cv') {

      h += `<div class="scat">جنگنده‌های ناو (${fa(ac)}/۱۰) · بدون بمب‌افکن</div>`;
      ['f35', 'f22'].forEach(u => g += B(`buyU('${u}')`, '✈️ ' + UT[u].n, UT[u].c, ac >= 10));

    }
    if (s.k == 'mis') g += s.mcd > 0 ? '<button class="full" disabled>🚀 شارژ موشک<small>' + fa(s.mcd + .99) + ' ث</small></button>' : B(`aim('mis')`, '🚀 شلیک موشک', 300, false, 'full atk-btn');
    if (s.k == 'int') g += INTUI(s);
    if (s.k == 'nuk') g += s.ammo > 0 ? '<button class="full atk-btn" onclick="aim(\'nuke\')">☢️ پرتاب بمب اتم<small>آماده</small></button>' : s.mcd > 0 ? '<button class="full" disabled>☢️ ساخت کلاهک<small>' + fa(Math.ceil(s.mcd)) + ' ث</small></button>' : B(`armNuke(${s.id})`, '☢️ ساخت کلاهک اتمی', 15000, false, 'full');
    if (s.b && E.filter(o => !o.team && o.b && !o.dead).length > 1) {
      const sv = Math.max(25, Math.floor(BT[s.k].c * .5 * Math.max(.1, s.hp / s.mh)));
      g += `<button class="full" onclick="sellB(${s.id})">♻️ فروش (+${fa(sv)} 💰)</button>`;
    }
    h += `<div class="sgrid">${g}</div>`;
  } else if (sel.length > 1 && sel.every(e => (e.k == 'nuk' || e.k == 'mis') && !e.dead)) {

    const lb = all ? '☢️ پرتاب همگانی' : nk ? '⚔ حملهٔ همگانی' : '🚀 شلیک همگانی';
    h += `<div class="shd"><span>${fa(sel.length)} × ${all ? '☢️ پایگاه اتمی' : nk ? 'پایگاه موشکی و اتمی' : '🚀 پایگاه موشکی'}</span><button class="cancel-btn" onclick="clearSel()">✕ لغو</button></div><div class="sgrid">`;
    h += rd ? `<button class="full atk-btn" onclick="gAtkMode()">${lb} (${fa(rd)} آماده)</button>` : `<button class="full" disabled>${lb}: هیچ‌کدام آماده نیست</button>`;
    h += '</div>';
  } else if (units.length) {
    const k0 = units[0].k, same = units.every(e => e.k === k0), uTitle = same ? (units.length > 1 ? fa(units.length) + ' × ' + UT[k0].n : UT[k0].n) : fa(units.length) + ' واحد رزمی';
    h += `<div class="shd"><span>${uTitle}</span><button class="cancel-btn" onclick="clearSel()">✕ لغو</button></div><div class="sgrid">`;
    h += `<button class="act-btn" onclick="stopSel()">⏹ توقف</button><button class="act-btn" onclick="retreatSel()">↩ بازگشت</button>`;
    const atkT = units.length > 1 ? 'حملهٔ همگانی' : 'حمله به هدف', lkU = units.filter(e => LK(e.k)), onlyLK = lkU.length > 0 && lkU.length === units.length, onlyToy = units.every(e => e.k == 'toy');
    if (onlyLK) {
      h += lkU.some(e => e.mcd <= 0) ? B('gAtkMode()', '⚔ ' + atkT, 300, false, 'full atk-btn') : '<button class="full" disabled><span>⚔ ' + atkT + '</span><small>شارژ ' + fa(Math.ceil(Math.min(...lkU.map(e => e.mcd)))) + ' ث</small></button>';
    } else if (onlyToy) {
      if (tc > 0) h += `<button class="full atk-btn" onclick="gAtkMode()" ${money[0] < 30 ? 'disabled' : ''}><span>⚔ ${atkT} (${fa(tc)})</span><small>${fa(30)} 💰</small></button>`;
    } else if (window.canAtkSel && window.canAtkSel(units)) {
      h += `<button class="full atk-btn" onclick="gAtkMode()">⚔ ${atkT}</button>`;
    }
    const tr = units.find(e => e.k == 'trc' && !(e.mcd > 0)) || units.find(e => e.k == 'trc');
    const trs_ = units.filter(e => e.k == 'trc' && !(e.mcd > 0));
    if (trs_.length > 1) h += B('layMineAll()', '💣 کاشت مین همگانی (' + fa(trs_.length) + ')', 120 * trs_.length, false, 'full');
    else if (tr) h += tr.mcd > 0 ? '<button class="full" disabled>💣 شارژ مین (' + fa(Math.ceil(tr.mcd)) + ' ث)</button>' : B(`layMine(${tr.id})`, '💣 کاشت مین', 120, false, 'full');
    if (!(tc > 0)) {
      const w = units.filter(e => e.k == 'toy' && e.dr <= 0);
      if (w.length) h += '<button class="full" disabled>🛩️ شارژ شاهد (' + fa(Math.ceil(42 - Math.max(...w.map(e => e.rl || 0)))) + ' ث)</button>';
    }
    h += `</div>`;
  }

  const sd = $('side');
  if (!h) { if (sd.style.display !== 'none') sd.style.display = 'none'; sd.dataset.h = ''; }
  else { if (sd.style.display !== 'flex') sd.style.display = 'flex'; if (sd.dataset.h !== h) { sd.dataset.h = h; sd.innerHTML = h; } }

  /* پنل گروه‌ها (#grp) */
  const gp = $('grp');
  if (!started || over) {
    gp.style.display = 'none'; gp.dataset.h = ''; gp.innerHTML = '';
  } else {
    const c = {};
    for (const e of E) if (!e.team && !e.dead && NM[e.k] && (e.k == 'mis' || e.k == 'nuk' || !e.b)) c[e.k] = (c[e.k] || 0) + 1;
    const ks = GRP.filter(k => c[k]);

      gp.style.display = 'none'; gp.dataset.h = ''; gp.innerHTML = '';
    } else {
      gp.style.display = 'flex';
      const u = sel.filter(e => !e.dead), k0 = u[0] && u[0].k, hom = u.length && u.every(e => e.k == k0) && NM[k0];
      let gh = `<div class="ghd"><span>واحدهای تو:</span>${u.length ? '<button class="cancel-btn" style="min-height:20px;padding:0 5px;font-size:10px" onclick="clearSel()">✕ لغو</button>' : ''}</div><div class="ggrid">`;
      for (const k of ks) gh += `<button class="${hom && k0 == k && u.length == c[k] ? 'on' : ''}" onclick="selAll('${k}')"><span>${NM[k]}</span><small>${fa(c[k])}</small></button>`;

  } else {
    const am = mode && mode.k == 'qf' ? Q_CHIPS.find(o => o.k == mode.q) : null;

/* توابع انتخاب هدف و فرمان‌های بازیکن */
function pick(team, px, py) {
  if (FF && team === 1) {
    return E.find(o => o.team !== 0 && !o.dead && o.v && H2(o.x - px, o.y - py) < o.r + 16 && !(o.st == 'idle' && df(o).fl && !o.b));
  }
  return E.find(o => o.team == team && !o.dead && (team == 0 || o.v) && H2(o.x - px, o.y - py) < o.r + 16 && !(o.st == 'idle' && df(o).fl && !o.b));
}

window.defAt = (px, py) => {
  let b = null, bd = 1e9;
  for (const o of E) {
    if (o.dead || !o.team || !o.v || !window.isDef(o)) continue;
    const d = H2(o.x - px, o.y - py);
    if (d < o.r + 22 && d < bd) { bd = d; b = o; }
  }
  return b;
};

window.disAt = (px, py) => {
  let b = null, bd = 1e9;
  for (const o of E) {
    if (o.dead || !o.team || !o.v || (o.st == 'idle' && df(o).fl && !o.b)) continue;
    const d = H2(o.x - px, o.y - py);
    if (d < o.r + 18 && d < bd) { bd = d; b = o; }
  }
  return b && window.isDisTarget(b) ? b : null;
};

function ecoAt(px, py) {
  let b = null, bd = 1e9;
  for (const o of E) {
    if (o.dead || !o.team || !o.v || (o.st == 'idle' && df(o).fl && !o.b)) continue;
    const d = H2(o.x - px, o.y - py);
    if (d < o.r + 18 && d < bd) { bd = d; b = o; }
  }
  return b && b.b && b.k == 'eco' ? b : null;
}

function ping(px, py, c) { FX.push({ x: px, y: py, vx: 0, vy: 0, l: .4, m: .4, r: 18, c, ring: 1 }); }

const ownOf = k => E.filter(e => !e.team && !e.dead && e.k == k && (k == 'mis' || k == 'nuk' || !e.b));
window.selAll = k => { mode = null; const u = ownOf(k); if (sel.length === u.length && sel.every(e => e.k === k)) sel = []; else sel = u; hud(); };
window.gAtkMode = () => { mode = mode && mode.k == 'gatk' ? null : { t: 'a', k: 'gatk' }; hud(); };

function bsel(k) {
  if (k == 'hq') { if (hasHQ(0)) return; }
  else if (!hasHQ(0)) { mode = null; flash(NOHQ); return; }
  mode = mode && mode.k == k ? null : { t: 'b', k };
  sel = [];
}

function aim(k) {
  mode = { t: 'a', k };
  if (k == 'hack') flash('🕶️ روی تولیدیِ دشمن بزن');
  if (k == 'emp') flash('⚡ روی ساختمان پدافند، ضدهوایی یا تاد دشمن بزن؛ ۱۲ ثانیه کور می‌شود');
  if (k == 'dis') flash('🌀 روی ساختمان (به‌جز مقر) یا ماشین دشمن بزن؛ ۳۰ ثانیه از کار می‌افتد');
}

function buyU(k) {
  if (!hasHQ(0)) { flash(NOHQ); return; }
  const s = sel[0];
  if (!s || (!s.b && s.k != 'cv') || money[0] < UT[k].c) return;
  ACT({ c: 'U', id: s.id, k });
  hud();
}

/* پردازش کلیک/ضربه روی نقشه (Tap) */
function tap(px, py) {
  if (over || !started || (window.SOLO && paused)) return;

  if (mode && mode.k == 'qf') {
    if (paused) return;
    const q = Q_CHIPS.find(o => o.k == mode.q);
    if (!q) { mode = null; return; }
    const L = lstQ(q, 1), n = cntQ(q, 1), raw = pick(1, px, py);
    const t = q.eco ? ecoAt(px, py) : q.def ? window.defAt(px, py) : q.dis ? window.disAt(px, py) : q.rep ? E.find(o => !o.team && !o.dead && (o.b || !df(o).fl) && H2(o.x - px, o.y - py) < o.r + 24) : raw;
    if (!L.length) { mode = null; flash('واحد آماده‌ای نمانده'); return; }
    if (q.eco && !(t && t.k == 'eco')) { flash(raw && raw.k != 'eco' ? '🕶️ هک فقط روی ساختمان تولیدی قابل اعمال است' : '🕶️ روی ساختمان تولیدیِ دشمن بزن'); return; }
    if (q.def && !(t && window.isDef(t))) { flash('⚡ روی ساختمان پدافند، ضدهوایی یا تاد دشمن بزن'); return; }
    if (q.dis && !t) { flash(raw && raw.k == 'hq' ? '🌀 مختل‌سازی روی مقر قابل اعمال نیست' : '🌀 روی ساختمان (به‌جز مقر) یا ماشین دشمن بزن'); return; }
    if (money[0] < q.c) { flash('پول کافی نیست'); return; }
    const C_ = q.hit && t ? L.filter(e => can(df(e), t)) : L;
    if (!C_.length) { flash('این واحد به آن هدف نمی‌زند'); return; }
    C_.sort((a, b) => H2(a.x - px, a.y - py) - H2(b.x - px, b.y - py));
    if (q.all) {
      for (const w of C_) { q.go(w, px, py, t); if (!q.nolock) QLK[w.id] = performance.now(); }
      ping(px, py, '#ff6a5a'); mode = null; return;
    }
    const u = C_[0];
    q.go(u, px, py, t);
    if (!q.nolock) QLK[u.id] = performance.now();
    ping(px, py, q.rep ? '#46d46e' : t ? '#ff6a5a' : '#fff');
    if (n <= 1) mode = null;
    return;
  }

  if (mode && mode.k == 'gatk') {
    gAttack(px, py); mode = null; hud(); return;
  }

  if (mode) {
    const m = mode, bk = m.t == 'b' ? m.k : null, mo = money[0];
    if (m.t == 'b') {
      const cs = window.bCost(0, m.k);
      if (money[0] < cs) { mode = null; return; }
      if (okp(0, m.k, px, py)) {
        ACT({ c: 'B', k: m.k, x: px, y: py });
        if (money[0] < mo) { BC[0] = performance.now() + 5000; if (bk == 'hq') mode = null; }
        if (money[0] < window.bCost(0, m.k)) mode = null;
      } else ping(px, py, '#ff4a3a');
      return;
    }
    const tg = pick(1, px, py);
    if (m.k == 'scan') {
      const ib = sel.find(e => e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.mcd > 0)) || E.find(e => !e.team && e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.mcd > 0));
      if (ib && money[0] >= 150) ACT({ c: 'R', id: ib.id, x: px, y: py });
    } else if (m.k == 'emp') {
      const ib = sel.find(e => e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.ecd > 0)) || E.find(e => !e.team && e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.ecd > 0));
      const td = window.defAt(px, py);
      if (!ib) { mode = null; flash('پالس EMP هنوز شارژ نشده'); return; }
      if (!td) { flash('⚡ روی ساختمان پدافند، ضدهوایی یا تاد دشمن بزن'); return; }
      if (money[0] < 1400) { mode = null; flash('پول کافی نیست'); return; }
      ACT({ c: 'E', id: ib.id, tid: td.id, x: td.x, y: td.y });
    } else if (m.k == 'hack') {
      const ib = sel.find(e => e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.rl > 0)) || E.find(e => !e.team && e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.rl > 0));
      const te = ecoAt(px, py);
      if (!ib) { mode = null; flash('هک در حال شارژ است یا ساختمان اطلاعات نداری'); return; }
      if (tg && tg.k != 'eco') { flash('🕶️ هک فقط روی ساختمان تولیدی قابل اعمال است'); return; }
      if (!te) { flash('🕶️ روی ساختمان تولیدیِ دشمن بزن؛ اگر دیده نمی‌شود اول اسکن کن'); return; }
      ACT({ c: 'K', id: ib.id, tid: te.id });
    } else if (m.k == 'dis') {
      const ib = sel.find(e => e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.dcd > 0)) || E.find(e => !e.team && e.k == 'int' && !e.dead && !(e.hk > 0) && !(e.dcd > 0));
      const te = window.disAt(px, py);
      if (!ib) { mode = null; flash(intWait()); return; }
      if (tg && tg.k == 'hq') { flash('🌀 مختل‌سازی روی مقر قابل اعمال نیست'); return; }
      if (!te) { flash('🌀 روی ساختمان (به‌جز مقر) یا ماشین دشمن بزن؛ اگر دیده نمی‌شود اول اسکن کن'); return; }
      if (money[0] < 3000) { mode = null; flash('پول کافی نیست'); return; }
      ACT({ c: 'DS', id: ib.id, tid: te.id });
    } else if (m.k == 'mis') {
      const b = E.find(e => !e.team && e.k == 'mis' && !(e.hk > 0) && e.mcd <= 0 && !e.dead);
      if (b && money[0] >= 300) ACT({ c: 'M', id: b.id, x: px, y: py });
    } else if (m.k == 'ml') {
      const s = sel.find(e => LK(e.k) && !(e.hk > 0) && e.mcd <= 0 && !e.dead);
      if (s && money[0] >= 300) ACT({ c: 'M', id: s.id, x: px, y: py });
    } else if (m.k == 'dr') {
      if (money[0] >= 30) ACT({ c: 'D', ids: mineIds(), x: px, y: py, tid: tg && tg.id });
      else flash('پول کافی نیست (۳۰ 💰)');
    } else if (m.k == 'nuke') {
      const b = sel.find(e => e.k == 'nuk' && !(e.hk > 0) && e.ammo > 0 && !e.dead);
      if (b) ACT({ c: 'N', id: b.id, x: px, y: py });
    }
    mode = null;
    return;
  }

  const me = E.filter(o => !o.team && !o.dead && H2(o.x - px, o.y - py) < o.r + 12).sort((a, b) => (a.b - b.b) || H2(a.x - px, a.y - py) - H2(b.x - px, b.y - py))[0];
  if (me) {
    if (sel.length && sel.every(e => e.k == 'rep' && !e.dead) && me.hp < me.mh && (me.b || !df(me).fl) && !sel.includes(me)) {
      ACT({ c: 'O', ids: mineIds(), x: me.x, y: me.y, tid: me.id });
      ping(me.x, me.y, '#46d46e');
      return;
    }
    if (sel.length === 1 && sel[0] === me) { sel = []; hud(); return; }
    sel = [me]; hud(); return;
  }
  if (sel.some(e => !e.b)) {
    const t = pick(1, px, py);
    ACT({ c: 'O', ids: mineIds(), x: px, y: py, tid: t && t.id });
    ping(px, py, t ? '#ff6a5a' : '#fff');
  } else {
    sel = []; hud();
  }
}

/* کنترل‌های لمسی، پینچ زوم و اینرسی دوربین */
const PTS = new Map();
let pt = null, pz0 = null, vx = 0, vy = 0, lt = 0;

cv.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(zm * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX, e.clientY);
}, { passive: false });

cv.onpointerdown = e => {
  vx = vy = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  PTS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTS.size == 1) pt = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, m: 0 };
  else {
    pt = null;
    const a = [...PTS.values()];
    pz0 = { d: H2(a[0].x - a[1].x, a[0].y - a[1].y) || 1, z: zm };
  }
};

cv.onpointermove = e => {
  const ox = cam.x, oy = cam.y, n = performance.now(), d = (n - lt) / 1000;
  if (PTS.has(e.pointerId)) PTS.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTS.size >= 2) {
    if (pz0) {
      const a = [...PTS.values()];
      setZoom(pz0.z * H2(a[0].x - a[1].x, a[0].y - a[1].y) / pz0.d, (a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2);
    }
    lt = n; return;
  }
  if (!pt) { lt = n; return; }
  const dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  if (H2(dx, dy) > 12) pt.m = 1;
  if (pt.m) { cam.x = pt.cx - dx * D / Z; cam.y = pt.cy - dy * D / Z; cl(); }
  if (PTS.size == 1 && pt && pt.m && d > 0 && d < .1) {
    const k = .4, ax = cam.x - ox, ay = cam.y - oy;
    vx = vx * (1 - k) + ax / d * k; vy = vy * (1 - k) + ay / d * k;
  }
  lt = n;
};

cv.onpointerup = e => {
  const n = PTS.size, mv_ = pt && pt.m, fresh = performance.now() - lt < 90;
  PTS.delete(e.pointerId);
  if (n >= 2) { if (PTS.size < 2) pz0 = null; pt = null; vx = vy = 0; return; }
  if (pt && !pt.m) tap(e.clientX * D / Z + cam.x, e.clientY * D / Z + cam.y);
  pt = null;
  if (!mv_ || !fresh || PTS.size) vx = vy = 0;
};

cv.onpointercancel = e => { PTS.delete(e.pointerId); pz0 = null; pt = null; };
cv.addEventListener('lostpointercapture', e => { PTS.delete(e.pointerId); if (PTS.size < 2) pz0 = null; });
addEventListener('blur', () => { PTS.clear(); pz0 = null; pt = null; vx = vy = 0; });

  for (const [k, a, b] of [['eco', -100, 60], ['eco', -60, 130], ['gnd', 60, 130], ['pd', -110, -90], ...(d ? [['eco', -150, 0], ['air', 160, -30]] : [])]) mk(1, k, q.x + a, q.y + b);

  ai.bm = 1; ai.bt = 0; ai.dt = 0; ai.el = 0; ai.t = 8; ai.w = 0; SMK.length = 0;
  const g = E.find(e => e.team == 1 && e.k == 'gnd');
  if (g) for (let i = 0; i < [1, 2, 3][d]; i++) spawn(1, 'tank', g);

  relief();

function pz() { paused = !paused; $('pzb').textContent = paused ? '▶' : '⏸'; }

function loop(t) {
  if (t - lt0 < 10) { requestAnimationFrame(loop); return; }
  const dt0 = Math.min((t - lt0) / 1000, .1); lt0 = t; PB = 2;
  if (zT != null) {
    if (Math.abs(zT - zm) < .002) { setZoom(zT); zT = null; }
    else setZoom(zm + (zT - zm) * Math.min(1, dt0 * 11));
  }
  if ((vx || vy) && !PTS.size) {
    const ox = cam.x, oy = cam.y;
    cam.x += vx * dt0; cam.y += vy * dt0; cl();
    if (cam.x == ox) vx = 0; if (cam.y == oy) vy = 0;
    const f = Math.exp(-4.2 * dt0); vx *= f; vy *= f;
    if (Math.abs(vx) + Math.abs(vy) < 10) vx = vy = 0;
  }
  if (started && !paused && !over && !document.hidden) {
    if (++gf > 0) {
      ga += Math.min(dt0, .06) * 1000;
      if (gf >= 120) {
        const av = ga / gf; gf = 0; ga = 0;
        if (av > 31 && QS > .76) { QS = Math.max(.75, QS * .9); rs(); }
      }
    }
  }
  requestAnimationFrame(loop);
  const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
  if (started && !paused && !over) upd(dt);
  if (started && ++hc % 6 == 1) { hud(); mini(); }
  if (started) draw();
}

let fe = 0, eT = 0;
onerror = m => {
  try { console.error(m); } catch (_) {}
  if (started) {
    const n = performance.now();
    if (n - eT > 6000) { eT = n; try { flash('⚠️ خطای جزئی؛ بازی ادامه دارد'); } catch (_) {} }
    return;
  }
  if (fe++) return;
  $('ov').style.display = 'flex';
  $('ov').innerHTML = '<div class=card><h1>خطا</h1><p>' + m + '</p></div>';
};

addEventListener('resize', rs);
rs();
requestAnimationFrame(loop);

      if (okp(1, 'hq', px, py)) { XC(1, { c: 'B', k: 'hq', x: px, y: py }); return; }
    }
  }

  window.aiStep = function (dt) {
    A.el += dt; A.t -= dt;
    if (A.t > 0) return;
    const L = LV[A.lv]; A.t = rnd(L.tk[0], L.tk[1]);
    const get = () => { const my = E.filter(e => e.team == 1 && !e.dead); return [my, my.find(e => e.k == 'hq')]; };
    let [my, hq] = get();
    if (!hq) { aiRebuild(my); return; }
    const foe = E.filter(e => !e.team && !e.dead);
    if (L.idle && Math.random() < L.idle) return;
    for (let i = 0; i < L.buys; i++) { [my, hq] = get(); if (!hq) return; aiBuy(my, hq, foe); }
    [my, hq] = get(); if (!hq) return;
    aiSpecialOps(my, foe, hq);
    aiArmy(my, foe, hq);
    aiIntelAndMsl(my, foe, hq, 0);
  };

  /* سنتز موسیقی پویا (WebAudio) */
  let ac = null, mg = null, calmBus = null, epicBus = null, revIn = null, NBUF = null;
  const AU = { mute: false, cur: -1, want: 0, ready: 0, prep: 0 };
  try { AU.mute = localStorage.getItem('ms_mute') == '1'; } catch (_) {}
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function tone(type, f, t, a, d, r, pk, dest, cut, det) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; if (det) o.detune.value = det;
    let n = o;
    if (cut) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut; o.connect(lp); n = lp; }
    n.connect(g); g.connect(dest);
    const h = Math.max(a, d);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(pk, t + a); g.gain.setValueAtTime(pk, t + h); g.gain.exponentialRampToValueAtTime(.0001, t + h + r);
    o.start(t); o.stop(t + h + r + .05);
  }

  function nzs(t, d, v, type, fr, dest, q) {
    const s = ac.createBufferSource(); s.buffer = NBUF;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = fr; if (q) f.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * .4); s.stop(t + d + .03);
  }

  function drum(t, f0, f1, dec, v, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dec * .45);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dec);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dec + .03);
  }

  const CB = 60 / 62, CCH = [{ b: 45, p: [57, 60, 64, 69] }, { b: 41, p: [53, 57, 60, 65] }, { b: 48, p: [55, 60, 64, 67] }, { b: 43, p: [55, 59, 62, 67] }], PENT = [69, 72, 74, 76, 79, 81];
  function calmStep(s, t) {
    const ch = CCH[(s >> 3) & 3], bt = s & 7;
    if (bt == 0) {
      ch.p.forEach((m, i) => {
        tone('sine', mtof(m), t, 2.4, 8 * CB, 3.4, .045, calmBus, 1400, (i - 1.5) * 5);
        tone('triangle', mtof(m), t, 2.8, 8 * CB, 3.4, .028, calmBus, 1000, (1.5 - i) * 6);
      });
      tone('sine', mtof(ch.b), t, 1.4, 8 * CB, 2.6, .12, calmBus, 320);
    }
    if (Math.random() < (bt % 2 == 0 ? .72 : .38)) {
      const pool = ch.p.map(m => m + 12).concat(Math.random() < .4 ? PENT : []), m = pool[Math.floor(Math.random() * pool.length)], tt = t + Math.random() * .05;
      tone('triangle', mtof(m), tt, .01, .02, 1.7 + Math.random(), .075, calmBus, 2800);
      if (Math.random() < .3) tone('sine', mtof(m + 12), tt, .005, .01, 1.1, .02, calmBus);
    }
  }

  const ES = 60 / 132 / 4, ECH = [{ r: 38, p: [50, 53, 57] }, { r: 34, p: [46, 50, 53] }, { r: 41, p: [53, 57, 60] }, { r: 36, p: [48, 52, 55] }];
  const LEAD = [[[0, 69, 6], [6, 74, 2], [8, 77, 4], [12, 76, 2], [14, 74, 2]], [[0, 74, 6], [6, 70, 2], [8, 74, 4], [12, 77, 4]], [[0, 77, 6], [6, 72, 2], [8, 77, 4], [12, 79, 2], [14, 81, 2]], [[0, 79, 4], [4, 76, 4], [8, 72, 4], [12, 67, 4]]];
  function epicStep(s, t) {
    const bar = s >> 4, st = s & 15, ch = ECH[bar & 3], sec = (bar >> 2) & 1, B = epicBus;
    if (st % 4 == 0) drum(t, 170, 44, .34, .85, B);
    if (st == 10 && (bar & 1)) drum(t, 150, 46, .28, .55, B);
    if (st == 4 || st == 12) { nzs(t, .15, .16, 'bandpass', 2200, B, .8); drum(t, 220, 110, .12, .3, B); }
    if (st % 4 == 2) nzs(t, .035, .03, 'bandpass', 6000, B, .7);
    if (st == 0) drum(t, 95, 52, .9, .55, B);
    if ((bar & 3) == 3 && st >= 12) drum(t, 150 - (st - 12) * 14, 70, .22, .4, B);
    if (st % 2 == 0) { tone('sawtooth', mtof(ch.r + 12), t, .005, .1, .09, st % 4 == 0 ? .15 : .1, B, 520); if (st % 4 == 0) tone('sine', mtof(ch.r), t, .005, .14, .1, .2, B); }
    if (st == 0) {
      ch.p.forEach((m, i) => {
        tone('sawtooth', mtof(m), t, .25, 16 * ES, .5, .03, B, 1200, (i - 1) * 7);
        tone('sawtooth', mtof(m + 12), t, .3, 16 * ES, .5, .016, B, 1500, (1 - i) * 7);
      });
    }
    if (!sec && (st == 0 || st == 6 || st == 10)) ch.p.forEach(m => tone('sawtooth', mtof(m + 12), t, .004, .05, .1, .035, B, 2200));
    if (sec) for (const n of LEAD[bar & 3]) if (n[0] == st) {
      const f = mtof(n[1]), d = n[2] * ES * .92;
      tone('sawtooth', f, t, .03, d, .14, .05, B, 2600, -8);
      tone('sawtooth', f, t, .03, d, .14, .05, B, 2600, 8);
      tone('square', f / 2, t, .03, d, .14, .025, B, 1800);
    }
  }

  function mkImpulse(sec) {
    const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let p = 0;
      for (let i = 0; i < n; i++) { p += ((Math.random() * 2 - 1) - p) * .22; d[i] = p * Math.pow(1 - i / n, 2.8); }
    }
    return b;
  }

  function buildOff() {
    mg = ac.createGain(); mg.gain.value = .55;
    const cp = ac.createDynamicsCompressor(); cp.threshold.value = -20; cp.knee.value = 24; cp.ratio.value = 6; cp.attack.value = .006; cp.release.value = .3;
    const lpf = ac.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 7500;
    mg.connect(lpf); lpf.connect(cp); cp.connect(ac.destination);
    const cvv = ac.createConvolver(); cvv.buffer = mkImpulse(1.3);
    const rg = ac.createGain(); rg.gain.value = .6;
    revIn = ac.createGain(); revIn.connect(cvv); cvv.connect(rg); rg.connect(mg);
    calmBus = ac.createGain(); calmBus.gain.value = 0; calmBus.connect(mg);
    { const s = ac.createGain(); s.gain.value = .8; calmBus.connect(s); s.connect(revIn); }
    epicBus = ac.createGain(); epicBus.gain.value = 0; epicBus.connect(mg);
    { const s = ac.createGain(); s.gain.value = .16; epicBus.connect(s); s.connect(revIn); }
    NBUF = ac.createBuffer(1, Math.floor(ac.sampleRate * 1.5), ac.sampleRate);
    { const d = NBUF.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  }

  function buildAudio() {
    mg = ac.createGain(); mg.gain.value = AU.mute ? 0 : .7;
    const cp = ac.createDynamicsCompressor(); cp.threshold.value = -8; cp.knee.value = 12; cp.ratio.value = 3; cp.attack.value = .01; cp.release.value = .25;
    mg.connect(cp); cp.connect(ac.destination);
    calmBus = ac.createGain(); calmBus.gain.value = 0; calmBus.connect(mg);
    epicBus = ac.createGain(); epicBus.gain.value = 0; epicBus.connect(mg);
  }

  const rendr = oc => new Promise((res, rej) => {
    oc.oncomplete = e => res(e.renderedBuffer);
    try { const p = oc.startRendering(); if (p && p.then) p.then(res, rej); } catch (e) { rej(e); }
  });

  async function renderLoop(md) {
    const real = ac, sr = Math.min(real.sampleRate || 44100, 44100), len = md ? 128 * ES : 32 * CB, tail = 2.6;
    const OC_ = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const oc = new OC_(2, Math.ceil(sr * (len + tail)), sr), sv = [ac, mg, calmBus, epicBus, revIn, NBUF];
    try {
      ac = oc; buildOff(); (md ? epicBus : calmBus).gain.value = md ? .55 : .6;
      const fn = md ? epicStep : calmStep, dur = md ? ES : CB, n = md ? 128 : 32;
      for (let s = 0; s < n; s++) fn(s, .02 + s * dur);
    } finally { [ac, mg, calmBus, epicBus, revIn, NBUF] = sv; }
    const buf = await rendr(oc), L = Math.round(len * sr), out = real.createBuffer(2, L, sr);
    for (let c = 0; c < 2; c++) {
      const s = buf.getChannelData(Math.min(c, buf.numberOfChannels - 1)), d = out.getChannelData(c);
      for (let i = 0; i < L; i++) d[i] = s[i] + (i + L < s.length ? s[i + L] : 0);
    }
    return out;
  }

  let CBUF = null, EBUF = null, calmS = null, epicS = null;
  async function prep() { CBUF = await renderLoop(0); EBUF = await renderLoop(1); }

  function setMode(m) {
    AU.want = m;
    if (!ac || !AU.ready || AU.cur === m) return;
    AU.cur = m;
    const t = ac.currentTime;
    if (!calmS) { calmS = ac.createBufferSource(); calmS.buffer = CBUF; calmS.loop = true; calmS.connect(calmBus); calmS.start(t); }
    if (m == 1) {
      if (epicS) { epicS.g.gain.cancelScheduledValues(t); epicS.g.gain.setTargetAtTime(0, t, .04); try { epicS.s.stop(t + .4); } catch (_) {} }
      const g = ac.createGain(), s = ac.createBufferSource();
      s.buffer = EBUF; s.loop = true; s.connect(g); g.connect(epicBus); s.start(t); epicS = { s, g };
      epicBus.gain.cancelScheduledValues(t); epicBus.gain.setTargetAtTime(1, t, .12);
      calmBus.gain.cancelScheduledValues(t); calmBus.gain.setTargetAtTime(0, t, 1.1);
    } else {
      calmBus.gain.cancelScheduledValues(t); calmBus.gain.setTargetAtTime(1, t, 1.2);
      epicBus.gain.cancelScheduledValues(t); epicBus.gain.setTargetAtTime(0, t, 1.4);
      if (epicS) try { epicS.s.stop(t + 8); } catch (_) {}
    }
  }

  function unlock() {
    if (!ac) {
      const C_ = window.AudioContext || window.webkitAudioContext; if (!C_) return;
      try {
        try { ac = new C_({ latencyHint: 'playback' }); } catch (_) { ac = new C_(); }
        window.__AC = ac; buildAudio();
      } catch (_) { ac = null; return; }
    }
    if (ac.state != 'running') { try { ac.resume(); } catch (_) {} }
    if (!AU.ready && !AU.prep) {
      AU.prep = 1;
      prep().then(() => { AU.ready = 1; setMode(AU.want); }).catch(e => { AU.prep = 0; try { console.error(e); } catch (_) {} });
    }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, true));
  document.addEventListener('visibilitychange', () => { if (!ac) return; try { document.hidden ? ac.suspend() : ac.resume(); } catch (_) {} });

  let lastC = -1e9;
  function evalMode() {
    const n = performance.now();
    const play = started && !over && !paused && !document.hidden && menuE.style.display !== 'flex' && ovE.style.display !== 'flex';
    if (play && (TR.length || M.length || BB.length)) lastC = n;
    setMode(play && n - lastC < 14000 ? 1 : 0);
  }
  setInterval(evalMode, 250);

  function sndUI() {
    const s = AU.mute ? '🔇' : '🔊', a = $('snd'), b = $('mnsnd');
    if (a) a.textContent = s;
    if (b) b.textContent = s + ' صدا: ' + (AU.mute ? 'خاموش' : 'روشن');
  }
  window.SND = {
    toggle() {
      AU.mute = !AU.mute;
      try { localStorage.setItem('ms_mute', AU.mute ? '1' : '0'); } catch (_) {}
      if (mg) mg.gain.setTargetAtTime(AU.mute ? 0 : .7, ac.currentTime, .05);
      sndUI(); unlock();
    },
    muted: () => AU.mute
  };
  sndUI();

  /* بوت و پیش‌رندر اسپرایت‌ها در هنگام لودینگ */
  async function boot() {
    const t0 = performance.now();
    ldShow('در حال بارگذاری…', 0);
    try {
      const jobs = [];
      for (const t of [0, 1]) {
        for (const k of Object.keys(BT)) jobs.push(() => bsp(k, t));
        for (const k of ['tank', 'aa', 'tad', 'rep', 'toy', 'lch', 'clu', 'trc']) { jobs.push(() => gsp(k, t)); jobs.push(() => tsp(k, t)); }
        for (const k of ['f35', 'f22', 'b2', 'b52', 'drone']) jobs.push(() => asp(k, t));
        jobs.push(() => psp(t));
      }
      for (const p of [0, 1]) for (let v = 0; v < 4; v++) jobs.push(() => trs(p, v));
      const n = jobs.length;
      for (let i = 0; i < n; i++) {
        try { jobs[i](); } catch (_) {}
        if (i % 3 == 2) { ldProg(.06 + .84 * (i + 1) / n); await frame(); }
      }
      ldS.textContent = 'آماده‌سازی نهایی…'; ldProg(.96);
      await sleep(Math.max(250, 1700 - (performance.now() - t0)));
      ldProg(1); ldS.textContent = 'آماده!';
      await sleep(280);
    } catch (e) { try { console.error(e); } catch (_) {} }
    finally { mainMenu(); ldHide(); }
  }

  boot();
})();

</script>
